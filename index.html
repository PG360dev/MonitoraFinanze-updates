<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MonitoraFinanze — versione disponibile</title><style>:root{font-family:system-ui,sans-serif;color:#202b42;background:#f5f7fb}body{margin:0;min-height:100dvh;display:grid;place-items:center}main{margin:24px;padding:32px;border:1px solid #e4e9f1;border-radius:18px;background:white;max-width:520px}h1{font-size:24px;margin:0 0 24px}p{line-height:1.6}small{color:#67748a}strong{color:#4857d9}</style></head><body><main><h1>MonitoraFinanze</h1><p id="version" role="status">Verifica della versione disponibile…</p><p>Il changelog è privato e consultabile su GitHub esclusivamente dagli utenti autorizzati.</p></main><script>
fetch('./latest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{if(Object.keys(v).sort().join(',')!=='build,version'||!/^\d+\.\d+\.\d+$/.test(v.version)||!/^\d{12}$/.test(v.build))throw Error();const p=document.getElementById('version');p.textContent='Ultima versione disponibile: '+v.version;const small=document.createElement('small');small.textContent='Build '+v.build;p.appendChild(document.createElement('br'));p.appendChild(small)}).catch(()=>{document.getElementById('version').textContent='Versione al momento non verificabile.'});
</script></body></html>
